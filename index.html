<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>My News</h1>
    <p id="updated-at" class="updated-at">Loading...</p>
  </header>

  <main id="news-grid" class="news-grid">
    <p class="loading">Loading latest articles...</p>
  </main>

  <footer class="site-footer">
    <p>Headlines pulled automatically from public RSS feeds. Article images are screened by an automated filter; a small number may occasionally slip through unfiltered.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
